# push / PR 마다 빌드가 깨지지 않는지 검사한다.
# 릴리스는 하지 않는다 — 그건 release.yml 담당.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

      # 빌드된 jar를 Actions 화면에서 내려받을 수 있게 남긴다.
      # PR 단계에서 실제로 게임에 넣어보고 싶을 때 쓴다.
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: medievalarms-dev-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
