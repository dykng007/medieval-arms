# v로 시작하는 태그를 밀면 여기가 돈다.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# 하는 일: 빌드 → GitHub Release 생성 + jar 첨부 → CurseForge 업로드.
#
# CurseForge 시크릿(CURSEFORGE_ID / CURSEFORGE_TOKEN)이 아직 없어도 실패하지 않는다.
# mc-publish는 토큰이 빈 문자열이면 그 플랫폼을 조용히 건너뛴다.
# 나중에 CurseForge 프로젝트가 승인되면 시크릿 두 개만 등록하면 되고,
# 이 파일은 손댈 필요가 없다. (docs/CURSEFORGE.md 참고)
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # Release를 만들려면 쓰기 권한이 필요하다

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 변경 이력 기반 changelog 생성을 위해 전체 히스토리를 받는다

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 태그 v0.2.0 → MOD_VERSION=0.2.0
      # 태그에 -alpha / -beta 가 들어 있으면 릴리스 종류도 그에 맞게 정한다.
      # 보통은 태그에서 버전을 뽑는다: v0.2.0 -> 0.2.0
      # 다만 Actions 화면에서 수동 실행(workflow_dispatch)하면 태그가 없어
      # GITHUB_REF가 refs/heads/main 이 된다. 그 경우에는 gradle.properties의
      # mod_version을 쓴다. 이 분기가 없으면 버전이 "refs/heads/main"이 되어버린다.
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="$(grep -E '^mod_version=' gradle.properties | cut -d '=' -f 2 | tr -d '[:space:]')"
            TAG="v$VERSION"
            echo "태그가 아닌 수동 실행입니다. gradle.properties의 버전을 씁니다."
          fi

          case "$VERSION" in
            *alpha*) TYPE=alpha ;;
            *beta*|*rc*) TYPE=beta ;;
            *) TYPE=release ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "릴리스 $TAG / 버전 $VERSION / 종류 $TYPE"

      - name: Build
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build --stacktrace

      - name: Publish
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          # 배포할 파일: dev/sources/javadoc jar은 제외한 본 jar
          files: build/libs/!(*-@(dev|sources|javadoc)).jar

          name: Medieval Arms ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ steps.version.outputs.type }}

          loaders: neoforge
          game-versions: 1.21.1
          java: 21

          # 필수 의존성. 배포처 페이지에 "이것도 같이 받아야 한다"고 표시된다.
          #
          # 이 모드는 무기 휘두르는 애니메이션을 PlayerAnimator 로 재생한다.
          # 라이브러리가 없으면 게임이 아예 켜지지 않으므로(mods.toml 에서 required)
          # 표시가 없으면 받은 사람이 이유도 모른 채 실행에 실패한다.
          #
          # 아이디는 각 배포처에서 직접 확인한 값이다. 예전에 CurseForge 프로젝트
          # 아이디를 추측했다가 업로드가 통째로 실패한 적이 있어 추측하지 않는다.
          #   CurseForge  658587    (프로젝트 페이지의 Project ID)
          #   Modrinth    gedNE4y2  (api.modrinth.com/v2/project/playeranimator)
          dependencies: |
            playeranimator(required){curseforge:658587}{modrinth:gedNE4y2}

          # 한 플랫폼이 실패해도 나머지는 계속 발행한다.
          # 기본값 fail 은 첫 오류에서 즉시 멈추는데, mc-publish가 CurseForge를
          # GitHub보다 먼저 처리하기 때문에 CurseForge가 삐끗하면 GitHub 릴리스가
          # 아예 만들어지지 않는다. 실제로 프로젝트 ID가 틀렸을 때 그렇게 됐다.
          # skip 은 오류를 경고로 남기고 남은 대상을 마저 처리한 뒤,
          # 실행 상태만 실패로 표시한다. 릴리스는 지키면서 문제도 묻히지 않는다.
          fail-mode: skip

          # GitHub Release — 항상 동작
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.tag }}
          github-generate-changelog: true

          # CurseForge — 시크릿이 비어 있으면 자동으로 건너뜀
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
