# Gradle 자체 설정
# 마인크래프트 디컴파일에 메모리를 많이 쓰므로 기본값(1G)보다 넉넉하게 잡는다.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment: 마인크래프트 코드의 변수/파라미터 이름을 사람이 읽을 수 있게 매핑해준다.
# 최신 버전: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ── 환경 버전 ──────────────────────────────────────────────
# 최신 NeoForge 버전 확인: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[4,)

# ── 모드 정보 (여기만 고치면 전체에 반영됨) ────────────────
# 모드 식별자. 소문자/숫자/밑줄만 가능.
mod_id=medievalarms
# 게임 안에 표시되는 이름
mod_name=Medieval Arms
mod_license=MIT
# 모드 버전. 릴리스할 때는 이 값을 올리고 같은 번호로 v태그를 민다.
# CI에서는 태그값(MOD_VERSION 환경변수)이 이 값을 덮어쓴다.
mod_version=0.1.1
mod_group_id=com.dykng.medievalarms
mod_authors=dykng007
# 주의: 이 파일의 값은 Gradle이 자바 Properties 규격(ISO-8859-1)으로 읽는다.
# 그래서 한글을 넣으면 깨진다. 모드 설명문처럼 한글이 필요한 값은
# src/main/templates/META-INF/neoforge.mods.toml 안에 직접 적어야 한다.
