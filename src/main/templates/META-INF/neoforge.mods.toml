# 이 파일은 템플릿이다. 달러-중괄호 자리표시자는 빌드할 때 gradle.properties 값으로 치환된다.
# (build.gradle의 generateModMetadata 태스크가 처리한다.)
# 고칠 값이 있으면 대부분 gradle.properties 쪽을 고치면 된다.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# 바닐라 열거형에 항목을 추가하겠다는 선언.
# 이 모드는 팔 자세(HumanoidModel.ArmPose)에 두 가지를 더한다.
enumExtensions="META-INF/enumextensions.json"
authors="${mod_authors}"
description='''
중세 무기와 갑옷을 추가합니다. 무기 종류에 따라 휘두르는 모션이 달라집니다.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# 무기를 휘두르는 애니메이션을 재생하는 라이브러리.
# 없으면 모드가 아예 켜지지 않게 required 로 둔다. 애니메이션이 이 모드의 핵심이라
# 라이브러리 없이 켜지면 무기만 있고 모션이 없는 반쪽짜리가 되기 때문이다.
[[dependencies.${mod_id}]]
    modId="playeranimator"
    type="required"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
