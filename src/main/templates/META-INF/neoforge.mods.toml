# 이 파일은 템플릿이다. 달러-중괄호 자리표시자는 빌드할 때 gradle.properties 값으로 치환된다.
# (build.gradle의 generateModMetadata 태스크가 처리한다.)
# 고칠 값이 있으면 대부분 gradle.properties 쪽을 고치면 된다.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# 바닐라 열거형에 항목을 추가하겠다는 선언.
# 이 모드는 팔 자세(HumanoidModel.ArmPose)에 두 가지를 더한다.
enumExtensions="META-INF/enumextensions.json"
authors="${mod_authors}"
description='''
중세 무기와 갑옷을 추가합니다. 무기 종류에 따라 휘두르는 모션이 달라집니다.
'''

# 믹스인 설정 파일 위치를 FML에 알린다.
# 3인칭 휘두르기 동작을 바꾸는 데 쓰인다 (mixin/HumanoidModelMixin 참고).
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
